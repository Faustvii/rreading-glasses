name: docker-build

# Reusable workflow that builds and pushes both image variants
# (goodreads -> ":latest", hardcover -> ":hardcover") for linux/amd64
# and linux/arm64 to GHCR.
#
# Two mutually-compatible modes, driven by inputs:
#   edge:    publish the moving development tags ("edge" + "sha-<short>").
#   version: publish release tags for the given semver ("latest"/"hardcover",
#            "X.Y.Z", and "X.Y").

on:
  workflow_call:
    inputs:
      edge:
        description: "Publish the moving edge/sha development tags."
        type: boolean
        default: false
      version:
        description: "Semver (e.g. 1.2.3) to publish release tags for. Empty = skip release tags."
        type: string
        default: ""

env:
  IMAGE: ghcr.io/faustvii/rreading-glasses

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Goodreads variant is the default image (":latest").
          - variant: goodreads
            rgpath: ./cmd/rggr
            moving_tag: latest
            prefix: ""
          # Hardcover variant is published under the "hardcover" prefix.
          - variant: hardcover
            rgpath: ./cmd/rghc
            moving_tag: hardcover
            prefix: "hardcover-"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.prefix }}edge,enable=${{ inputs.edge }}
            type=sha,prefix=${{ matrix.prefix }}sha-,enable=${{ inputs.edge }}
            type=raw,value=${{ matrix.moving_tag }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{version}},prefix=${{ matrix.prefix }},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.prefix }},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RGPATH=${{ matrix.rgpath }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
